[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-viu"
version = "0.1.0"
description = "Reproducible susceptibility-inventory evaluation for a VIU Master's thesis"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
